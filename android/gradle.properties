# NO org.gradle.java.home HERE, deliberately.
#
# It used to point at an absolute Windows path (C:\Program Files\Eclipse Adoptium\...),
# committed to a repository whose CI builds on Ubuntu. Gradle could not start at all
# there. It worked on exactly one machine and broke on every other, which is the
# definition of a setting that does not belong in version control.
#
# JDK selection is per-machine, so it belongs in a per-machine file. Put it in your
# GRADLE USER HOME (~/.gradle/gradle.properties), which is never committed, or set
# JAVA_HOME when invoking gradlew. CI does the latter via actions/setup-java.
#
# This machine's DEFAULT JDK is Java 26, which the Android Gradle Plugin rejects, so
# something must select JDK 21 locally; requirements.txt records the verified version
# (21.0.12+8). The COMPILE toolchain is pinned portably in app/build.gradle.kts, which
# is why that one is committed and this one is not.

org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# HR-8.5 belt-and-braces: even if a manifest attribute is dropped, a release build must
# not be debuggable. The authoritative check is internal/cigates/android_manifest_test.go.
android.debug.obsoleteApi=false
