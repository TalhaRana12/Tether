# This machine's default JDK is Java 26, which the Android Gradle Plugin does not
# support. JAVA_HOME is deliberately NOT changed system-wide — that would affect
# unrelated tooling. The fix belongs to the project, so it lives here.
#
# Adjust the path if your Temurin install differs; `requirements.txt` records the version
# this was verified against (21.0.12+8).
org.gradle.java.home=C\:\\Program Files\\Eclipse Adoptium\\jdk-21.0.12.8-hotspot

org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# HR-8.5 belt-and-braces: even if a manifest attribute is dropped, a release build must
# not be debuggable. The authoritative check is internal/cigates/android_manifest_test.go.
android.debug.obsoleteApi=false
